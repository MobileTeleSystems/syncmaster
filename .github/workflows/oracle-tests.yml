name: Oracle Tests
on:
  workflow_call:

env:
  DEFAULT_PYTHON: '3.13'

jobs:
  tests:
    name: Run Oracle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Oracle
        run: |
          docker compose -f docker-compose.test.yml --profile all down -v --remove-orphans
          docker compose -f docker-compose.test.yml --profile oracle up -d db rabbitmq horizon test-oracle

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Worker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: mtsrus/syncmaster-worker:${{ github.sha }}
          target: test
          file: docker/Dockerfile.worker
          load: true
          cache-from: type=gha,scope=test

      - name: Start worker
        run: |
          docker compose -f docker-compose.test.yml --profile oracle up -d --wait --wait-timeout 200
        env:
          WORKER_IMAGE_TAG: ${{ github.sha }}

      - name: Run tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          retry_on: error
          max_attempts: 3
          command: |
            rm -rf reports/*
            docker compose -f ./docker-compose.test.yml --profile oracle exec -T worker coverage run -m pytest -vvv -s ./tests/test_integration/test_run_transfer -m oracle --junitxml=/app/reports/junit/${RANDOM}.xml

      - name: Dump worker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2
        with:
          images: gvenzl/oracle-xe,mtsrus/syncmaster-worker,mtsrus/horizon-backend,postgres,rabbitmq
          dest: ./logs

      # This is important, as coverage is exported after receiving SIGTERM
      - name: Shutdown
        if: always()
        run: |
          docker compose -f docker-compose.test.yml --profile all down -v --remove-orphans

      - name: Upload worker logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: worker-logs-oracle
          path: logs/*

      - name: Upload coverage results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-oracle
          path: reports/*
          # https://github.com/actions/upload-artifact/issues/602
          include-hidden-files: true
